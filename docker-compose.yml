services:
  weihnachts-gutscheine:
    build: .
    container_name: weihnachts-gutscheine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: "Europe/Berlin"
      PORT: "8080"
      # Diesen Wert durch einen langen eigenen Zufallswert ersetzen.
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET muss in Portainer gesetzt werden}"
    volumes:
      - gutscheine_data:/data

volumes:
  gutscheine_data:
